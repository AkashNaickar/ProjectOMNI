name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-lint:
    name: Backend lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check python-backend --exclude venv,.tmp-venv --select E4,E7,E9,F

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r python-backend/requirements.txt pytest
      - run: pytest python-backend/tests -q

  frontend-build:
    name: Frontend build (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the tracked working tree only. Git history contains a known,
      # owner-acknowledged leak pending credential rotation (see NEEDS_ME.md);
      # history is never rewritten in this repo.
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz
          # Scan a clean export of HEAD (tracked tree only). Git history contains
          # a known, owner-acknowledged leak pending credential rotation
          # (see NEEDS_ME.md); history is never rewritten in this repo.
          mkdir /tmp/tree && git archive HEAD | tar -x -C /tmp/tree
          ./gitleaks dir /tmp/tree --redact --exit-code 1
